name: himachal_transit_mobile
description: "Himachal Transit - Bus Tracking System"
version: 0.1.0+1
environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Navigation
  go_router: ^14.1.1
  # Networking
  dio: ^5.4.3+1
  # Secure storage
  flutter_secure_storage: ^9.2.2
  # Environment config
  flutter_dotenv: ^5.1.0
  # JSON serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  # Location & GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  # Realtime WebSocket
  socket_io_client: ^2.0.3+1
  # Maps (placeholder for now)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Code generation
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - .env